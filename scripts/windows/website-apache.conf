ServerRoot "C:/xampp/apache"
Listen 127.0.0.1:${POCKETFINDS_PORT}
ServerName pocketfindsph.shop
PidFile "${POCKETFINDS_ROOT}/storage/app/private/cloudflare/apache.pid"
ErrorLog "${POCKETFINDS_ROOT}/storage/app/private/cloudflare/apache-error.log"
LogLevel warn
ThreadsPerChild 64
MaxConnectionsPerChild 0
Timeout 60

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule alias_module modules/mod_alias.so
LoadModule headers_module modules/mod_headers.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
TypesConfig conf/mime.types
DirectoryIndex index.php
DocumentRoot "${POCKETFINDS_ROOT}/public"

<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "${POCKETFINDS_ROOT}/public">
    Options -Indexes +FollowSymLinks
    Require all granted
</Directory>

ProxyRequests Off
ProxyPreserveHost On
RewriteEngine On
RewriteCond "${POCKETFINDS_ROOT}/storage/app/mobile-image-cache/$1/$2" -f
RewriteRule "^/(?:app-api/)?media/products/(product_images)/(.+)$" "${POCKETFINDS_ROOT}/storage/app/mobile-image-cache/$1/$2" [END]
<Proxy "balancer://pocketfinds">
    BalancerMember "http://127.0.0.1:8011" connectiontimeout=3 timeout=60
    BalancerMember "http://127.0.0.1:8012" connectiontimeout=3 timeout=60
    BalancerMember "http://127.0.0.1:8013" connectiontimeout=3 timeout=60
    BalancerMember "http://127.0.0.1:8014" connectiontimeout=3 timeout=60
    ProxySet lbmethod=byrequests
</Proxy>
ProxyPassMatch "^/download/android$" "!"
ProxyPassMatch "^/(app-api/)?media/products/(product_images|images|profiles|profile-pictures|hero_banners|logistics_logos)/" "!"
ProxyPass "/" "balancer://pocketfinds/"
ProxyPassReverse "/" "balancer://pocketfinds/"

# Only the API's public image folders bypass PHP. Private media keeps its auth.
AliasMatch "^/(?:app-api/)?media/products/(product_images|images|profiles|profile-pictures|hero_banners|logistics_logos)/(.*)$" "${POCKETFINDS_ROOT}/storage/app/public/$1/$2"
<DirectoryMatch "^${POCKETFINDS_ROOT}/storage/app/public/(product_images|images|profiles|profile-pictures|hero_banners|logistics_logos)(/.*)?$">
    Options -Indexes -ExecCGI -FollowSymLinks
    AllowOverride None
    Require all denied
    <FilesMatch "\.(?i:jpe?g|png|webp|gif|avif|ico|mp4|webm)$">
        Require all granted
        SetHandler none
        Header set Cache-Control "public, max-age=86400"
        Header set X-Content-Type-Options "nosniff"
    </FilesMatch>
</DirectoryMatch>
<Directory "${POCKETFINDS_ROOT}/storage/app/mobile-image-cache/product_images">
    Options -Indexes -ExecCGI -FollowSymLinks
    AllowOverride None
    Require all granted
    ForceType image/webp
    SetHandler none
    Header set Cache-Control "public, max-age=86400"
    Header set X-Content-Type-Options "nosniff"
</Directory>

# Apache streams APKs directly, leaving PHP free for website and app requests.
AliasMatch "^/download/android$" "${POCKETFINDS_ROOT}/storage/app/releases/pocketfinds.apk"
<Directory "${POCKETFINDS_ROOT}/storage/app/releases">
    Options -Indexes
    Require all denied
    <Files "pocketfinds.apk">
        Require all granted
        ForceType application/vnd.android.package-archive
        Header set Content-Disposition "attachment; filename=PocketFinds.apk"
        Header set Cache-Control "no-cache"
        Header set X-Content-Type-Options "nosniff"
    </Files>
</Directory>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
